<!doctype html>
<html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>名古屋靜岡旅行手帳</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one light pastel storybook page. Banner, title, travel-mates card, sticky day tabs, then a dotted timeline of horizontal cards, each with a hand-drawn picture on the left and a hanko stamp for finished stops. Light only, by choice. */
:root{
  --bg:#FFF9F6; --dot:#FBE8EE; --surface:#FFFFFF; --surface-2:#FFF1F5; --ink:#4B4560; --muted:#6B6485; --line:#F0D3DE; --edge:#EBD0DB;
  --seal:#C9435A; --focus:#B83A72;
  --pink:#F7BCD0; --yellow:#F8E3A1; --mint:#B7E2CB; --sky:#B9DDF3; --orange:#F9D0A8; --purple:#D5C9F2;
  --c-sight:var(--pink); --c-food:var(--orange); --c-kids:var(--mint); --c-drive:var(--sky); --c-hotel:var(--purple); --c-flight:var(--yellow);
  --m0:var(--pink); --m1:var(--mint); --m2:var(--sky); --m3:var(--purple); --m4:var(--orange); --m5:var(--yellow);
  --sky-top:#D6ECFA; --sky-bot:#FFF3F6; --sun:#FBE29A; --fuji:#A9BDF0; --fuji-cap:#FFFFFF; --cloud:#FFFFFF;
  --hill1:#C5EBD6; --hill2:#FAD3E0; --petal:#F6AEC7; --cheek:#F8A9C0; --spark:#F6D56E;
  --car:#F9CFA9; --carw:#DDF1FB; --wheel:#6F6887; --balloon:#F7BCD0; --basket:#F9D0A8;
  --shadow:0 8px 22px rgba(117,98,140,.13);
  --f-display:'Mochiy Pop One','Huninn','Zen Maru Gothic','Noto Sans TC',sans-serif;
  --f-head:'Huninn','Zen Maru Gothic','Noto Sans TC',system-ui,sans-serif;
  --f-body:'Huninn','Noto Sans TC','Zen Maru Gothic',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.localbar{margin:10px 0 0;padding:10px 16px;border-radius:20px;background:var(--yellow);color:#4B4560;font-family:var(--f-head);font-size:15px;line-height:1.6}
.nav{margin-top:10px;display:grid;gap:8px}
.nrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.nlab{font-family:var(--f-head);font-weight:700;font-size:13px;background:var(--sky);color:#4B4560;border-radius:999px;padding:0 10px}
.nlab.p{background:var(--mint)}
.ncode{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:18px;letter-spacing:.03em;background:#fff;border:2px dashed var(--edge);border-radius:12px;padding:0 10px;overflow-wrap:anywhere}
.cbtn{display:inline-flex;align-items:center;min-height:34px;padding:2px 12px;border-radius:999px;border:2px solid var(--edge);background:#fff;font-family:var(--f-head);font-weight:700;font-size:14px;cursor:pointer;color:var(--ink);text-decoration:none}
.nmemo{margin:0;font-size:14px;color:var(--muted);line-height:1.6}
.nmiss{margin:0;font-size:14px;color:var(--muted)}
.pkbox{background:var(--surface-2);border-radius:16px;padding:8px 12px;display:grid;gap:6px}
.pkbox h5{margin:0;font-family:var(--f-head);font-size:14px;color:var(--muted)}
.pkname{font-weight:700;font-size:15px}

body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--dot) 2px,transparent 2.5px);background-size:26px 26px;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.7;padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.ic{display:inline-grid;place-items:center;width:1.2em;height:1.2em;flex:none}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* banner */
.banner{display:block;width:100%;height:clamp(150px,30vw,210px);overflow:hidden}
.banner svg{display:block;width:100%;height:100%}
.sun{fill:var(--sun)} .halo{fill:var(--sun);opacity:.45} .fuji{fill:var(--fuji)} .cap{fill:var(--fuji-cap)} .cloud{fill:var(--cloud)}
.hill1{fill:var(--hill1)} .hill2{fill:var(--hill2)} .petal{fill:var(--petal)} .spark{fill:var(--spark)}
.eye{fill:currentColor} .smile{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round} .cheek{fill:var(--cheek);opacity:.85}
.fs,.ff,.fc{color:#4B4560}
.carb{fill:var(--car)} .carw{fill:var(--carw)} .wheel{fill:var(--wheel)} .hub{fill:#fff}
.bl{fill:var(--balloon)} .bk{fill:var(--basket)} .str{stroke:var(--wheel);stroke-width:1.4;fill:none}
.drift{animation:drift 7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.drift.b{animation-duration:9s;animation-delay:-3s}
.bob{animation:bob 4s ease-in-out infinite alternate}
.twinkle{animation:twinkle 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.car{animation:drive 20s linear infinite}
@keyframes drift{from{transform:translate(0,0) rotate(0)}to{transform:translate(10px,14px) rotate(40deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-8px)}}
@keyframes twinkle{from{transform:scale(.7)}to{transform:scale(1.15)}}
@keyframes drive{from{transform:translateX(-90px)}to{transform:translateX(880px)}}
@media (prefers-reduced-motion: reduce){.drift,.bob,.twinkle{animation:none}.car{animation:none;transform:translateX(560px)}}

.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* title */
.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;padding-top:20px}
.top>div{min-width:0}
.eyebrow{display:inline-block;font-family:var(--f-head);font-weight:700;font-size:15px;letter-spacing:.1em;background:var(--yellow);color:#4B4560;border-radius:999px;padding:2px 16px}
h1{margin:10px 0 4px;font-family:var(--f-display);font-weight:400;font-size:clamp(36px,10vw,54px);line-height:1.15;text-shadow:2px 2px 0 var(--yellow);text-wrap:balance}
h1 span{color:var(--seal)}
.sub{margin:0;color:var(--muted);font-weight:700;font-size:17px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;padding:0;list-style:none}
.facts li{display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--edge);border-radius:999px;padding:3px 14px 3px 10px;font-size:15px;font-weight:700}
.facts .ic{color:var(--seal)}
.stamp{flex:none;width:100px;height:100px;border-radius:50%;transform:rotate(-8deg);border:3px double var(--seal);color:var(--seal);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-head);font-weight:700;line-height:1.1;margin-right:6px}
.stamp small{font-size:13px;letter-spacing:.06em}
.stamp b{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.05}

/* members */
.members{margin-top:22px;background:var(--surface);border:2px dashed var(--edge);border-radius:26px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.members h2{margin:0 6px 0 0;font-family:var(--f-head);font-size:16px;font-weight:700;background:var(--sky);color:#4B4560;border-radius:999px;padding:0 14px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:2px solid var(--edge);border-radius:999px;padding:2px 14px 2px 3px;font-weight:700;font-size:16px;max-width:100%}
.pill i{font-style:normal;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--m0);color:#4B4560;font-family:var(--f-head);font-weight:700;font-size:14px;flex:none}
.pill span{overflow-wrap:anywhere}
.hint{color:var(--muted);font-size:15px}
.members .sp{flex:1}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;border:2px solid var(--edge);border-radius:999px;padding:6px 20px;font-family:var(--f-head);font-weight:700;font-size:16px;cursor:pointer;background:var(--surface);color:var(--ink);transition:transform .12s}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#4B4560}
.btn.danger{color:var(--seal);border-color:var(--seal)}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:16px;padding-block:8px 6px;border-bottom:2px dotted var(--line)}
.rail{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:4px 4px 8px}
.rail::-webkit-scrollbar{display:none}
.tab{flex:none;display:grid;justify-items:center;min-width:68px;padding:5px 12px;border-radius:20px;border:2.5px solid var(--dc);background:var(--surface);cursor:pointer;position:relative;line-height:1.3;transition:transform .15s}
.tab .td{font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums}
.tab .tw{font-size:14px;font-weight:700;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--dc);color:#4B4560;transform:translateY(-2px);box-shadow:var(--shadow)}
.tab[aria-selected="true"] .tw{color:#4B4560}
.tab.today::after{content:"";position:absolute;top:-4px;right:-4px;width:13px;height:13px;border-radius:50%;background:var(--seal);border:2.5px solid var(--bg)}

/* day */
#day{padding-top:16px}
.dayhead{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:color-mix(in srgb,var(--dc) 28%,#fff);border:2.5px solid var(--dc);border-radius:28px;padding:14px 20px;box-shadow:var(--shadow)}
.dateblock{display:grid;place-items:center;align-content:center;width:84px;height:84px;border-radius:50%;background:var(--dc);color:#4B4560;line-height:1.05;transform:rotate(-6deg);flex:none}
.date{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.wd{font-size:14px;font-weight:700}
.dayinfo{min-width:0;flex:1 1 220px}
.dayinfo h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:23px;line-height:1.35;text-wrap:balance}
.hotel{margin:2px 0 0;display:flex;align-items:center;gap:6px;font-size:16px;font-weight:500}
.hotel .ic{color:var(--seal)}
.hotel span:last-child{overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:700;font-family:var(--f-head);border-radius:999px;padding:0 12px}
.chip.drive{background:var(--sky);color:#4B4560}
.chip.prog{background:#fff;color:var(--seal);border:2px solid var(--seal)}

/* timeline */
.tl{list-style:none;margin:20px 0 0;padding:0 0 0 32px;position:relative;display:grid;gap:20px}
.tl::before{content:"";position:absolute;left:12px;top:18px;bottom:18px;border-left:3px dotted var(--line)}
.stop{position:relative}
.stop::before{content:"";position:absolute;left:-29px;top:24px;width:16px;height:16px;border-radius:50%;background:var(--c);border:3px solid var(--bg);box-shadow:0 0 0 2px var(--c)}
.card{display:grid;grid-template-columns:208px minmax(0,1fr);background:color-mix(in srgb,var(--c) 16%,#fff);border:2.5px solid color-mix(in srgb,var(--c) 70%,#fff);border-radius:26px;overflow:hidden;box-shadow:var(--shadow)}
.pic{position:relative;min-height:150px;background:color-mix(in srgb,var(--c) 22%,#fff)}
.pic>svg{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);display:block;border-radius:20px;border:3px solid #fff;box-shadow:0 3px 10px rgba(117,98,140,.18)}
.mark{position:absolute;right:16px;bottom:16px;width:72px;height:72px;border-radius:50%;border:3px double var(--seal);color:var(--seal);background:rgba(255,255,255,.88);display:grid;place-items:center;font-family:var(--f-display);font-size:19px;line-height:1.1;transform:rotate(-14deg);pointer-events:none}
.mark.fresh{animation:stampin .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes stampin{0%{transform:rotate(-14deg) scale(2.4);opacity:0}70%{opacity:1}100%{transform:rotate(-14deg) scale(1)}}
@media (prefers-reduced-motion: reduce){.mark.fresh{animation:none}.btn,.tab{transition:none}}
.cbody{padding:14px 18px 16px;min-width:0;display:flex;flex-direction:column;gap:6px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font-size:14px;font-weight:700;font-family:var(--f-head);background:var(--c);color:#4B4560;border-radius:999px;padding:0 12px}
.tm{font-family:var(--f-head);font-weight:700;font-size:15px;background:#fff;border:2px solid var(--edge);border-radius:999px;padding:0 10px;font-variant-numeric:tabular-nums}
.title{margin:2px 0 0;font-family:var(--f-head);font-weight:700;font-size:20px;line-height:1.45;overflow-wrap:anywhere}
.note{margin:0;color:var(--muted);font-size:16px;line-height:1.7;font-weight:500;white-space:pre-line;overflow-wrap:anywhere}
.by{margin:0;font-size:14px;color:var(--muted);font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.sbtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:4px 14px;border-radius:999px;border:2px dashed var(--seal);color:var(--seal);background:#fff;cursor:pointer;font-family:var(--f-head);font-weight:700;font-size:15px}
.sbtn:hover{background:color-mix(in srgb,var(--seal) 10%,#fff)}
.sbtn.on{border-style:solid;background:color-mix(in srgb,var(--seal) 10%,#fff)}
.ebtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:4px 14px;border-radius:999px;border:2px solid var(--edge);background:#fff;cursor:pointer;font-family:var(--f-head);font-weight:700;font-size:15px}
.ebtn:hover{background:var(--surface-2)}
.dby{font-size:14px;color:var(--seal);font-weight:700}
.add{width:100%;margin-top:20px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:24px;border:2.5px dashed var(--pink);background:#fff;color:var(--ink);font-family:var(--f-head);font-weight:700;font-size:18px;cursor:pointer}
.add:hover{background:var(--surface-2)}
.empty,.msg{background:#fff;border:2.5px dashed var(--pink);border-radius:24px;padding:22px;text-align:center;color:var(--muted);font-weight:700;margin-top:20px}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:22px}
.tip{border-radius:24px;padding:12px 18px 16px;min-width:0;border:2.5px solid color-mix(in srgb,var(--c) 70%,#fff);background:color-mix(in srgb,var(--c) 18%,#fff)}
.tip.d{--c:var(--sky)} .tip.k{--c:var(--mint)}
.tip h4{margin:0 0 4px;display:inline-flex;align-items:center;gap:6px;font-family:var(--f-head);font-size:16px;background:var(--c);color:#4B4560;border-radius:999px;padding:0 14px}
.tip p{margin:4px 0 0;font-size:16px;line-height:1.7;font-weight:500;overflow-wrap:anywhere}
.foot{margin-top:30px;text-align:center;color:var(--muted);font-size:14px;font-weight:700}

/* sheets */
.sheetwrap{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(75,69,96,.35)}
.sheet{position:relative;width:min(540px,100%);max-height:92%;overflow-y:auto;background:#fff;border:3px solid var(--pink);border-bottom:0;border-radius:30px 30px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:6px}
@media (min-width:600px){.sheetwrap{align-items:center}.sheet{border-bottom:3px solid var(--pink);border-radius:30px}}
.sheet h2{margin:0 0 4px;font-family:var(--f-display);font-weight:400;font-size:26px;color:var(--seal);text-shadow:2px 2px 0 var(--yellow)}
.sheet label,.sheet legend{font-family:var(--f-head);font-weight:700;font-size:15px;margin-top:6px;padding:0}
.sheet input[type=text],.sheet input[type=time],.sheet select,.sheet textarea{width:100%;border:2px solid var(--edge);border-radius:16px;background:var(--bg);padding:8px 14px;min-height:46px;font-size:16px}
.sheet textarea{resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2>div{min-width:0;display:grid;gap:6px}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px}
.actions .sp{flex:1}
fieldset{border:0;margin:0;padding:0;min-width:0}
.sw{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.sw label{margin:0;cursor:pointer}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw span{display:block;width:38px;height:38px;border-radius:50%;border:2px solid var(--edge)}
.sw input:checked+span{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--seal)}
.sw input:focus-visible+span{outline:3px solid var(--focus);outline-offset:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--yellow);color:#4B4560;border:2px solid var(--edge);box-shadow:var(--shadow);padding:8px 22px;border-radius:999px;font-weight:700;font-size:16px;max-width:calc(100% - 32px);text-align:center}

.modes{display:flex;gap:10px;margin-top:18px}
.mode{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:999px;border:2.5px solid var(--edge);background:#fff;font-family:var(--f-head);font-weight:700;font-size:18px;cursor:pointer;color:var(--ink)}
.mode[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);box-shadow:var(--shadow)}
#shop{padding-top:16px}
.shophead{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;background:color-mix(in srgb,var(--pink) 28%,#fff);border:2.5px solid var(--pink);border-radius:28px;padding:14px 20px;box-shadow:var(--shadow)}
.thumb{width:112px;height:72px;border-radius:16px;overflow:hidden;border:3px solid #fff;box-shadow:0 3px 10px rgba(117,98,140,.18);flex:none}
.thumb svg{display:block;width:100%;height:100%}
.shophead h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.3}
.shophead p{margin:0;font-size:16px;font-weight:500}
.quick{display:flex;gap:10px;margin-top:16px}
.quick input{flex:1;min-width:0;min-height:50px;border:2.5px solid var(--edge);border-radius:999px;background:#fff;padding:8px 18px;font-size:17px}
.sgroup{margin:22px 0 0;font-family:var(--f-head);font-size:16px;font-weight:700;color:var(--muted)}
.slist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:12px}
.sitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:#fff;border:2.5px solid var(--edge);border-radius:22px;padding:10px 14px;box-shadow:var(--shadow)}
.sitem.done{background:color-mix(in srgb,var(--mint) 22%,#fff);border-color:color-mix(in srgb,var(--mint) 70%,#fff)}
.chk{width:46px;height:46px;border-radius:50%;border:3px dashed var(--seal);background:#fff;color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;font-size:24px}
.chk:disabled{cursor:default}
.sitem.done .chk{border:3px double var(--seal);background:var(--seal)}
.sname{margin:0;font-family:var(--f-head);font-weight:700;font-size:19px;line-height:1.4;overflow-wrap:anywhere}
.sitem.done .sname{text-decoration:line-through;color:var(--muted)}
.smeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.smeta .chip{background:var(--surface-2);border:2px solid var(--edge);color:var(--ink)}
.snote{margin:4px 0 0;font-size:15px;color:var(--muted);font-weight:500;overflow-wrap:anywhere}
@media (max-width:520px){
  .thumb{width:96px;height:62px}
}
@media (max-width:520px){
  .card{grid-template-columns:1fr}
  .pic{min-height:0;height:160px}
  .tl{padding-left:26px}
  .tl::before{left:8px}
  .stop::before{left:-26px;width:14px;height:14px;top:20px}
  .stamp{width:88px;height:88px}
  .stamp b{font-size:30px}
}
</style>

<header class="banner" aria-hidden="true">
<svg viewBox="0 0 800 200" preserveAspectRatio="xMaxYMax slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky-top)"/><stop offset="1" style="stop-color:var(--sky-bot)"/></linearGradient>

}
const isShopHash=()=>location.hash==='#shop';
function setMode(m){mode=m;try{location.hash=m==='shop'?'shop':'day-'+curDay;}catch(e){}render();}
function render(){
  updateTabs();renderMembers();
  document.querySelectorAll('.mode').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===mode?'true':'false'));
  const sm=mode==='shop';
  $('#daytabs').hidden=sm;$('#day').hidden=sm;$('#shop').hidden=!sm;
  if(sm)renderShop();else renderDay();
}

/* stamping */
async function toggleStamp(it){
  if(local){const n=!it.done;if(n){LS.done[it.id]=1;freshId=it.id;}else delete LS.done[it.id];lsSave();localApply();render();toast(n?'蓋咗個章！':'取消咗蓋章');setTimeout(()=>{if(freshId===it.id)freshId=null;},1200);return;}
  if(!mayEdit())return;
  const next=!it.done;
  if(next)freshId=it.id;
  try{
    await dbh.doc('items/'+it.id).update(next?{done:true,doneBy:meId||null,doneTs:Date.now()}:{done:false});
    toast(next?'蓋咗個章！':'取消咗蓋章');
    setTimeout(()=>{if(freshId===it.id)freshId=null;},1200);
  }catch(e){freshId=null;toast(errMsg(e));}
}

/* shopping list */
function sitem(it){
  const editable=mayEdit()||local,by=it.by&&members[it.by]?members[it.by].nick:'',doneBy=it.done&&it.doneBy&&members[it.doneBy]?members[it.doneBy].nick:'';
  const chk=h('button',{class:'chk',type:'button','aria-pressed':it.done?'true':'false','aria-label':(it.done?'取消買咗：':'買咗：')+it.name,disabled:!editable,onclick:()=>toggleBought(it)},it.done?icon('check'):null);
  return h('li',{class:'sitem'+(it.done?' done':'')},chk,
    h('div',{style:'min-width:0'},
      h('p',{class:'sname',text:it.name}),
      (it.qty||it.store)?h('div',{class:'smeta'},it.qty?h('span',{class:'chip',text:'數量 '+it.qty}):null,it.store?h('span',{class:'chip'},icon('pin'),it.store):null):null,
      it.note?h('p',{class:'snote',text:it.note}):null,
      (doneBy||by)?h('p',{class:'by',text:doneBy?doneBy+' 買咗':'由 '+by+' 記低'}):null),
    (mayEdit()||(local&&isMine(it)))?h('button',{class:'ebtn',type:'button','aria-label':'改「'+it.name+'」',onclick:()=>openShop(it)},icon('pencil'),'改'):null);
}
function renderShop(){
  const todo=shop.filter(i=>!i.done).sort((a,b)=>(a.ts||0)-(b.ts||0)),got=shop.filter(i=>i.done).sort((a,b)=>(b.doneTs||0)-(a.doneTs||0));
  const head=$('#shophead');head.replaceChildren();
  const thumb=h('div',{class:'thumb'});thumb.innerHTML=SCENES.mall;
  head.append(h('div',{class:'shophead'},thumb,h('div',{class:'dayinfo'},
    h('h2',{text:'購物清單'}),
    h('p',{text:shopStatus==='ready'?(shop.length?'買咗 '+got.length+' / '+shop.length+' 樣':'未有項目'):'載入緊…'}),
    h('p',{class:'hint',text:'想買嘅嘢大家一齊記，買咗就㩒圓圈蓋章。'}))));
  $('#shopadd').hidden=!((mayEdit()||local)&&shopStatus==='ready');
  const box=$('#shoplist');box.replaceChildren();
  if(status==='nodb'){box.append(h('div',{class:'msg',text:'要用 Claude 登入，先睇到同改到購物清單。'}));return;}
  if(shopStatus==='error'){box.append(h('div',{class:'msg',text:'購物清單載入唔到，請重新整理。'}));return;}
  if(shopStatus==='loading'){box.append(h('div',{class:'msg',text:'購物清單載入緊…'}));return;}
  if(!shop.length){box.append(h('div',{class:'empty',text:'仲未有想買嘅嘢。'+(mayEdit()?'喺上面寫低第一樣啦！':'')}));return;}
  if(todo.length)box.append(h('p',{class:'sgroup',text:'未買（'+todo.length+'）'}),h('ul',{class:'slist'},todo.map(sitem)));
  if(got.length)box.append(h('p',{class:'sgroup',text:'買咗（'+got.length+'）'}),h('ul',{class:'slist'},got.map(sitem)));
  if(local)box.append(h('p',{class:'hint',style:'text-align:center;margin-top:12px',text:'剔選同你自己加嘅項目只會記喺你部機。'}));
  else if(!mayEdit())box.append(h('p',{class:'hint',style:'text-align:center;margin-top:12px',text:'你而家淨係睇得。請行程主人將你設做 Contributor，先可以加同蓋章。'}));
}
async function toggleBought(it){
  if(local){const n=!it.done;if(isMine(it)){const m=LS.myshop.find(x=>x.id===it.id);if(m)m.done=n;}else if(n)LS.bought[it.id]=1;else delete LS.bought[it.id];lsSave();localApply();render();toast(n?'買咗！':'放返落未買');return;}
  if(!mayEdit())return;
  const next=!it.done;
  try{await dbh.doc('shop/'+it.id).update(next?{done:true,doneBy:meId||null,doneTs:Date.now()}:{done:false});toast(next?'買咗！':'放返落未買');}
  catch(e){toast(errMsg(e));}
}
async function quickAdd(ev){
  ev.preventDefault();
  const inp=$('#q-name'),name=inp.value.trim();
  if(!name){toast('寫低想買乜嘢先');inp.focus();return;}
  if(local){LS.myshop.push({id:'L'+Date.now(),name,qty:'',store:'',note:'',done:false,ts:Date.now()});lsSave();localApply();inp.value='';inp.focus();render();toast('加咗（只記喺你部機）');return;}
  try{await dbh.collection('shop').doc().set({name,qty:'',store:'',note:'',done:false,ts:Date.now(),by:meId||null});inp.value='';inp.focus();toast('加咗');}
  catch(e){toast(errMsg(e));}
}
function openShop(it){
  editingShop=it;sDelArm=false;
  $('#s-name').value=it.name||'';$('#s-qty').value=it.qty||'';$('#s-store').value=it.store||'';$('#s-note').value=it.note||'';
  const d=$('#s-del');d.textContent='刪除';
  showSheet('#shopsheet');$('#s-name').focus();
}
async function saveShop(ev){
  ev.preventDefault();
  if(!editingShop)return;
  const name=$('#s-name').value.trim();
  if(!name){toast('寫低名稱先');$('#s-name').focus();return;}
  if(local){const m=LS.myshop.find(x=>x.id===editingShop.id);if(m){m.name=name;m.qty=$('#s-qty').value.trim();m.store=$('#s-store').value.trim();m.note=$('#s-note').value.trim();}lsSave();localApply();closeSheets();render();toast('改好咗');return;}
  try{await dbh.doc('shop/'+editingShop.id).update({name,qty:$('#s-qty').value.trim(),store:$('#s-store').value.trim(),note:$('#s-note').value.trim()});closeSheets();toast('改好咗');}
  catch(e){toast(errMsg(e));}
}
async function delShop(){
  if(!editingShop)return;
  const b=$('#s-del');
  if(!sDelArm){sDelArm=true;b.textContent='真係刪除？再㩒一次';return;}
  if(local){LS.myshop=LS.myshop.filter(x=>x.id!==editingShop.id);lsSave();localApply();closeSheets();render();toast('已刪除');return;}
  try{await dbh.doc('shop/'+editingShop.id).delete();closeSheets();toast('已刪除');}
  catch(e){toast(errMsg(e));}
}

/* sheets */
function showSheet(id){$(id).hidden=false;}
function closeSheets(){$('#sheet').hidden=true;$('#joinsheet').hidden=true;$('#shopsheet').hidden=true;editing=null;editingShop=null;}
function refreshAfter(){
  const day=Number($('#f-day').value),sel=$('#f-after');
  const list=dayItems(day).filter(i=>!editing||i.id!==editing.id);
  sel.replaceChildren(h('option',{value:'auto',text:'自動（有時間按時間，否則排最尾）'}),h('option',{value:'first',text:'排第一'}),
    ...list.map(i=>h('option',{value:i.id,text:'喺「'+trunc(i.title)+'」之後'})));
  sel.value='auto';
}
function openEdit(it){
  editing=it;delArm=false;
  $('#sheet-title').textContent=it?'改行程':'加行程';
  $('#f-day').value=String(it?Number(it.day):curDay);
  $('#f-title').value=it?it.title:'';
  $('#f-time').value=it?(it.time||''):'';
  $('#f-cat').value=it&&CATS[it.cat]?it.cat:'sight';
  $('#f-note').value=it?(it.note||''):'';
  $('#f-mc').value=(it&&it.mc)||'';$('#f-tel').value=(it&&it.tel)||'';$('#f-mq').value=(it&&it.mq)||'';$('#f-mn').value=(it&&it.mn)||'';$('#f-pk').value=(it&&it.pk)||'';
  const del=$('#f-del');del.hidden=!it;del.textContent='刪除';
  refreshAfter();showSheet('#sheet');$('#f-title').focus();
}
function autoByTime(list,t){
  const last=list.length?list[list.length-1].order:0;
  if(!t)return last+10;
  const idx=list.findIndex(i=>i.time&&i.time>t);
  if(idx<0)return last+10;
  const prev=list[idx-1];return prev?(prev.order+list[idx].order)/2:list[idx].order-5;
}
async function saveItem(ev){
  ev.preventDefault();
  const title=$('#f-title').value.trim();
  if(!title){toast('寫低行程名稱先');$('#f-title').focus();return;}
  const day=Number($('#f-day').value),time=$('#f-time').value||'',cat=$('#f-cat').value,note=$('#f-note').value.trim();
  const list=dayItems(day).filter(i=>!editing||i.id!==editing.id),pos=$('#f-after').value;
  let order;
  if(pos==='first')order=list.length?list[0].order-5:10;
  else if(pos==='auto'){
    if(editing&&Number(editing.day)===day&&(editing.time||'')===time)order=editing.order;
    else order=autoByTime(list,time);
  }else{
    const k=list.findIndex(i=>i.id===pos),a=list[k],nx=list[k+1];
    order=nx?(a.order+nx.order)/2:a.order+10;
  }
  const data={day,order,time,title,note,cat,ts:Date.now(),mc:$('#f-mc').value.trim(),tel:$('#f-tel').value.trim(),mq:$('#f-mq').value.trim(),mn:$('#f-mn').value.trim(),pk:$('#f-pk').value.trim()};
  try{
    if(editing){await dbh.doc('items/'+editing.id).update(data);}
    else{if(meId)data.by=meId;await dbh.collection('items').doc().set(data);}
    const wasNew=!editing;closeSheets();
    if(day!==curDay)selectDay(day,true);
    toast(wasNew?'加咗行程':'改好咗');
  }catch(e){toast(errMsg(e));}
}
async function delItem(){
  if(!editing)return;
  const b=$('#f-del');
  if(!delArm){delArm=true;b.textContent='真係刪除？再㩒一次';return;}
  try{await dbh.doc('items/'+editing.id).delete();closeSheets();toast('已刪除');}
  catch(e){toast(errMsg(e));}
}
function openJoin(){
  const me=members[meId];
  $('#join-title').textContent=me?'改暱稱':'加入旅程';
  $('#j-nick').value=me?String(me.nick||''):'';
  joinColor=me?(Number(me.color)||0)%6:Object.keys(members).length%6;
  document.querySelectorAll('#j-sw input').forEach(r=>{r.checked=Number(r.value)===joinColor;});
  const hint=$('#j-hint');
  if(!meId){hint.hidden=false;hint.textContent='呢個瀏覽器認唔到你嘅帳戶，暫時加入唔到。';}
  else if(canWrite===false){hint.hidden=false;hint.textContent='你淨係有睇嘅權限。請行程主人將你設做 Contributor。';}
  else hint.hidden=true;
  showSheet('#joinsheet');$('#j-nick').focus();
}
async function saveJoin(ev){
  ev.preventDefault();
  const nick=$('#j-nick').value.trim();
  if(!nick){toast('寫個暱稱先');$('#j-nick').focus();return;}
  if(!meId){toast('暫時加入唔到');return;}
  try{await dbh.doc('members/'+meId).set({nick,color:joinColor,ts:(members[meId]&&members[meId].ts)||Date.now()});closeSheets();toast('加入咗，一齊排行程！');}
  catch(e){toast(errMsg(e));}
}

/* wiring */
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('[data-close]'))closeSheets();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheets();});
$('#form').addEventListener('submit',saveItem);
$('#joinform').addEventListener('submit',saveJoin);
$('#f-day').addEventListener('change',refreshAfter);
$('#f-del').addEventListener('click',delItem);
$('#shopadd').addEventListener('submit',quickAdd);
$('#shopform').addEventListener('submit',saveShop);
$('#s-del').addEventListener('click',delShop);
window.addEventListener('hashchange',()=>{if(isShopHash()){if(mode!=='shop'){mode='shop';render();}return;}const n=readHash();if(n&&(n!==curDay||mode!=='trip'))selectDay(n,true);});

async function init(){
  buildHeader();buildTabs();buildModes();
  curDay=readHash()||todayDay()||1;
  if(isShopHash())mode='shop';
  render();
  [dbh,usr]=await Promise.all([use('db'),use('user')]);
  if(usr){try{meId=await usr.id();canWrite=await usr.can('data.write');}catch(e){}}
  if(!dbh){
    local=true;lsLoad();localApply();status='ready';shopStatus='ready';
    const lb=$('#localbar');lb.hidden=false;lb.textContent='未登入 Claude：你睇到嘅係 '+SNAP.ts+' 嘅行程快照。蓋章同購物剔選會記喺你部機；想一齊加或改行程，請用 Claude 登入。';
    render();return;
  }
  dbh.collection('items').onSnapshot(snap=>{
    items=snap.docs.map(d=>Object.assign({id:d.id},d.data()));status='ready';render();
  },()=>{status='error';render();});
  dbh.collection('members').onSnapshot(snap=>{
    const m={};snap.docs.forEach(d=>{m[d.id]=d.data();});members=m;render();
  },()=>{});
  dbh.collection('shop').onSnapshot(snap=>{
    shop=snap.docs.map(d=>Object.assign({id:d.id},d.data()));shopStatus='ready';render();
  },()=>{shopStatus='error';render();});
  const b=document.querySelector('.tab[data-d="'+curDay+'"]');if(b&&b.scrollIntoView)b.scrollIntoView({block:'nearest',inline:'center'});
}
init();
</script>

</body></html>
